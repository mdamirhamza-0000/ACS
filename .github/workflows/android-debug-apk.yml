name: Build Android Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Print debug signing SHA-1
        if: always()
        run: |
          {
            echo "### Debug SHA-1"
            echo '```'
            ls -la ~/.android/ 2>&1 || true
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>&1 | grep -E "SHA1|SHA256|Alias|Error|error" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: avrok-acs-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
