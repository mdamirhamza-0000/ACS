name: Build Android Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: avrok-acs-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish APK to latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          cp "$APK" AVROK-ACS.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest AVROK-ACS.apk \
            --title "AVROK ACS (latest APK)" \
            --notes "Latest debug APK. Opens https://avrok-acs-electrician.vercel.app" \
            --latest
